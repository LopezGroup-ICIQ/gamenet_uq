[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gamenet-uq"
version = "0.1.3"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0", 
  "pandas>=2.0.0", 
  "scipy>=1.10.0", 
  "scikit-learn>=1.3.0", 
  "torch>=2.0.0", 
  "torch_geometric>=2.7.0", 
  "ase>=3.22.0", 
  "rdkit>=2023.3.3", 
  "matplotlib>=3.4.0", 
  "seaborn>=0.13.0", 
  "networkx>=3.1", 
  "tqdm>=4.65.0", 
]

authors = [
  {name = "Santiago Morandi", email = "santiagomorandi@yahoo.it"}
]
maintainers = [
  {name = "Santiago Morandi", email = "santiagomorandi@yahoo.it"}
]
description = "Graph Neural Network with uncertainty quantification for adsorption energy prediction"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["heterogeneous catalysis", "adsorption energy", "kinetics", "machine learning", "transition metals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.10"
]

[project.optional-dependencies]
dev = ["pytest", 
       "pytest-cov", 
       "coverage", 
       "codecov", 
       "flake8"
]

[project.urls]
Repository = "https://github.com/LopezGroup-ICIQ/gamenet_uq"
Bugtracker = "https://github.com/LopezGroup-ICIQ/gamenet_uq/issues"

[project.scripts]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--import-mode=importlib",
    "-v",
]
testpaths = [
    "tests",
]
pythonpath = "src"
